name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediaanvil-release.jks"

      - name: Test, lint, and build signed release
        env:
          MEDIAANVIL_KEYSTORE_PATH: ${{ runner.temp }}/mediaanvil-release.jks
          MEDIAANVIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDIAANVIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDIAANVIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify signature and release version
        id: package
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION_NAME="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          TAG="${GITHUB_REF_NAME:-v$VERSION_NAME}"
          test "$TAG" = "v$VERSION_NAME" || { echo "Tag $TAG does not match app version v$VERSION_NAME"; exit 1; }
          RELEASE_APK="MediaAnvil-$TAG.apk"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          path: |
            app/build/reports/lint-results-release.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ steps.package.outputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --verify-tag --generate-notes --title "MediaAnvil $TAG"
          fi
