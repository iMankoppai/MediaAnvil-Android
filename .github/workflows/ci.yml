name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Accept Android SDK licenses and install packages
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
